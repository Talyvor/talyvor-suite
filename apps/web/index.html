<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- B19.10: installable, so an iPhone can take approval pushes once it is on the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- B57.79: the logo kit's icons (brand/logo, copied by its build/web.sh). The .ico first so a
         browser that cannot read the SVG still has the logo; the SVG wins where it can. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- B29.15: the browser's own bar follows the light canvas when the reader prefers light; the first
         theme-color whose media matches wins, so the unconditioned dark one is the default. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" content="#0F1013" />
    <title>Talyvor</title>
    <!-- B28.1: what a search result and a shared link show. One static set for every address: this
         is a single-page app, so a crawler reads these bytes and never runs the script.
         B64.8: website version 4's title and description (design/website-2026-11-17-v4/index.html),
         and its share image, the Talyvor card cut to 1200 by 630 from the hero film's poster. -->
    <meta
      name="description"
      content="Give your AI agent its own account, wallet and card. Sign up, open an account, give your agent a card. It pays inside your rules and asks you before anything else."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talyvor" />
    <meta property="og:url" content="https://app.talyvor.com/marketing" />
    <meta property="og:title" content="Talyvor" />
    <meta
      property="og:description"
      content="Give your AI agent its own account, wallet and card. Sign up, open an account, give your agent a card. It pays inside your rules and asks you before anything else."
    />
    <meta property="og:image" content="https://app.talyvor.com/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Talyvor card with its logo." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talyvor" />
    <meta
      name="twitter:description"
      content="Give your AI agent its own account, wallet and card. Sign up, open an account, give your agent a card. It pays inside your rules and asks you before anything else."
    />
    <meta name="twitter:image" content="https://app.talyvor.com/og-card.jpg" />
    <meta name="twitter:image:alt" content="The Talyvor card with its logo." />
    <!-- No-flash theme: set data-theme before first paint, respecting a stored
         choice then prefers-color-scheme. The theme store reads this back.
         TWO READS, TWO CATCHES: only the stored choice can be refused, so a
         browser that blocks site data must still be asked what it prefers.
         src/noFlashTheme.test.ts runs these exact bytes and holds the cases. -->
    <script>
      (function () {
        var t = null
        try {
          t = localStorage.getItem('talyvor-theme')
        } catch (e) {
          /* Site data refused. That means there is no stored choice to read. It does not
             mean the reader chose the pale one. */
        }
        if (t !== 'light' && t !== 'dark') {
          t = 'light'
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
          } catch (e2) {
            /* No matchMedia at all. Nothing left to ask, and the attribute must still be
               set: theme.css declares every token under [data-theme], so an unset one
               renders the product with no canvas, no ink and no accent. */
          }
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <!-- B64.1: the /marketing hero film's poster (its first frame), preloaded before the bundle runs. Only on that
         address — every other screen would pay for a picture it never shows. The href is the poster Landing.tsx
         draws, so the preload is the image the page uses. The attribute keeps it apart from the no-flash script,
         which noFlashTheme.test.ts runs. -->
    <script data-preload="marketing-hero">
      ;(function () {
        if (!/^\/marketing(\/|$)/.test(location.pathname)) return
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/site/hero-loop-poster.cf75267b.jpg'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- B64.6: the AI Agents Directory's snippet, exactly as they give it (FOR-V7.md item 6). The listing goes live
         when their crawler finds it on talyvor.com, and a crawler reads these bytes and never runs the bundle, so
         the badge in Landing.tsx's footer is invisible to it. A reader with scripts on sees that footer instead. -->
    <noscript>
      <a href="https://aiagentsdirectory.com/agent/talyvor" target="_blank" rel="noopener" title="Discover Talyvor on AI Agents Directory">
        <img src="https://aiagentsdirectory.com/featured-badge.svg?v=2024" alt="Talyvor - Featured on AI Agents Directory" width="200" height="50" />
      </a>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
