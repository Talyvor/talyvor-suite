<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- B19.10: installable, so an iPhone can take approval pushes once it is on the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- B29.1: the brand-v4 icons, copied as drawn. The .ico first so a browser that cannot read
         the SVG still has the mark; the SVG wins where it can. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- B29.15: the browser's own bar follows the light canvas when the reader prefers light; the first
         theme-color whose media matches wins, so the unconditioned dark one is the default. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7FB" />
    <meta name="theme-color" content="#060A12" />
    <title>Talyvor — money and markets for AI agents</title>
    <!-- B28.1: what a search result and a shared link show. One static set for every address: this
         is a single-page app, so a crawler reads these bytes and never runs the script. -->
    <meta
      name="description"
      content="Wallets and cards for AI agents, within limits their owner sets, and a marketplace where agents spend. Credit and trading come later, through licensed partners."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talyvor" />
    <meta property="og:url" content="https://app.talyvor.com/marketing" />
    <meta property="og:title" content="Talyvor — money and markets for AI agents" />
    <meta
      property="og:description"
      content="Wallets and cards for AI agents, within limits their owner sets, and a marketplace where agents spend. Credit and trading come later, through licensed partners."
    />
    <meta property="og:image" content="https://app.talyvor.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Talyvor — money and markets for AI agents." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talyvor — money and markets for AI agents" />
    <meta
      name="twitter:description"
      content="Wallets and cards for AI agents, within limits their owner sets, and a marketplace where agents spend. Credit and trading come later, through licensed partners."
    />
    <meta name="twitter:image" content="https://app.talyvor.com/og-image.png" />
    <!-- No-flash theme: set data-theme before first paint, respecting a stored
         choice then prefers-color-scheme. The theme store reads this back.
         TWO READS, TWO CATCHES: only the stored choice can be refused, so a
         browser that blocks site data must still be asked what it prefers.
         src/noFlashTheme.test.ts runs these exact bytes and holds the cases. -->
    <script>
      (function () {
        var t = null
        try {
          t = localStorage.getItem('talyvor-theme')
        } catch (e) {
          /* Site data refused. That means there is no stored choice to read. It does not
             mean the reader chose the pale one. */
        }
        if (t !== 'light' && t !== 'dark') {
          t = 'light'
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
          } catch (e2) {
            /* No matchMedia at all. Nothing left to ask, and the attribute must still be
               set: theme.css declares every token under [data-theme], so an unset one
               renders the product with no canvas, no ink and no accent. */
          }
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <!-- B29.4: the /marketing hero photograph, preloaded before the bundle runs. Only on that
         address — every other screen would pay for a picture it never shows. The srcset and sizes
         are Landing.tsx's HERO_SRCSET and HERO_SIZES, so the preload is the image the page uses.
         The attribute keeps it apart from the no-flash script, which noFlashTheme.test.ts runs. -->
    <script data-preload="marketing-hero">
      ;(function () {
        if (!/^\/marketing(\/|$)/.test(location.pathname)) return
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/brand/photos/hero.jpg'
        l.setAttribute('imagesrcset', '/brand/photos/hero-1200.jpg 1200w, /brand/photos/hero.jpg 2400w')
        l.setAttribute('imagesizes', '(min-width: 840px) 50vw, 100vw')
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
