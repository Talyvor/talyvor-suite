packages:
  - packages/*
  - apps/*
  - e2e
# pnpm 11 gates dependency postinstall build scripts. `allowBuilds` is the record that
# `pnpm approve-builds` writes and that `pnpm install --frozen-lockfile` reads — so CI needs
# no build-permitting flag. It is SCOPED per-package: esbuild (its native binary, required
# by vite) is allowed; any other dependency that later adds a postinstall stays blocked
# until it is listed here and reviewed. (This is what the earlier `set this to true or
# false` placeholder was meant to become. Note: `onlyBuiltDependencies` is NOT honoured in
# pnpm 11.1.1 — verified — so `allowBuilds` is the correct key.)
allowBuilds:
  esbuild: true
# B42.5 — an install refuses what is too new or comes from somewhere odd: a version published less
# than seven days ago (minutes), a version whose publish carries weaker trust evidence than an earlier
# one of the same package, and a transitive dependency fetched from git or a tarball URL.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
# B28.263 — the `audit` CI job runs `pnpm audit` and fails on any known-vulnerable dependency.
# tailwindcss 3 pins postcss-selector-parser ^6, and the fix (GHSA-rj75-hqrm-r3gf) is only in 7.1.6;
# with 7.1.6 forced, apps/web's built CSS was byte-identical to the 6.1.4 build (measured).
overrides:
  postcss-selector-parser@<7.1.6: ^7.1.6
  # B44.4 — vite 6.4.4 (GHSA-587h-7wmj-h5pm) would lift rollup to 4.64.x, and every rollup from 4.63.0 lists
  # @napi-rs/lzma-linux-x64-gnu as an optional dependency that rollup's own code never loads (linux-x64-glibc
  # only: the CI runner). Kept at main's 4.62.2 until that is explained; see ~/talyvor-queue/FOUND.md.
  rollup: 4.62.2
  # B40.25 — zod <4.6.6 (GHSA-mrhx-c7xc-m3w5) reaches e2e through @modelcontextprotocol/sdk, which takes zod ^3.25 || ^4.0.
  zod@<4.6.6: ^4.6.7
  # B50.50 — @hono/node-server <2.1.6 (GHSA-qv5m-9pm6-hqp3, GHSA-jpvv-r467-5p4w) and the hono it brings, <4.13.16
  # (GHSA-4m76-xfj5-7975, GHSA-h7mg-cq63-vhpq, GHSA-3gg2-335m-rxc6), reach e2e through @modelcontextprotocol/sdk, whose
  # ranges (^2.0.5, ^4.11.4) already take the fixed releases.
  '@hono/node-server@<2.1.6': ^2.1.6
  hono@<4.13.16: ^4.13.16
# Each ignore is an advisory with no fix to take. Drop the line when its condition stops holding.
auditConfig:
  ignoreGhsas:
    # katex <0.18.2 (via mermaid): low; mermaid 12.1.0 requires katex ^0.16. mermaid 12.3.0 takes katex ^0.18 but moves
    # about 40 packages of apps/web's shipped bundle, so it is its own change (B67.3). The app's own katex is 0.19.
    - GHSA-238p-pmpm-9mq7
    # B17.312, B67.3 — minimatch <11.0.1 (via typescript-eslint's typescript-estree, lint-time only, on the repo's own
    # globs): typescript-eslint 8.72 takes minimatch ^10, and 8.73.0 (16 Nov 2026), the first to take ^11.0.1, is younger
    # than minimumReleaseAge. Drop this line and update typescript-eslint once 8.73.0 is seven days old (23 Nov 2026).
    - GHSA-g3hv-75wg-m249
    # B61.118 — picomatch <=4.0.7, ReDoS in extglob patterns (via typescript-eslint, vite, vitest's tinyglobby and fdir,
    # build and test time only, on the repo's own globs): no patched picomatch release exists (4.0.7 is the latest, 17 Nov
    # 2026). Drop this line and refresh the lockfile once a release >=4.0.8 is past minimumReleaseAge.
    - GHSA-fc5q-39xc-vjpf
