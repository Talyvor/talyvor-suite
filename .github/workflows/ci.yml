name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend gates. `lint` runs the local/no-arbitrary-value rule, so an arbitrary
  # Tailwind value (text-[#fff], p-[13px]) fails CI here — the design-system lock is
  # enforced by the pipeline, not by remembering to run it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (node24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
          cache: pnpm
      # No build-permitting flag: the postinstall allowance is committed per-package in
      # pnpm-workspace.yaml (allowBuilds: esbuild: true) and read from there, so ONLY
      # esbuild is allowed to build — consistent with pinning the Actions above. A new
      # dependency that adds a postinstall would be blocked here until reviewed and listed.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # GUARD 2 FOR THE WEB HALF — and the reason it is not `pnpm build`.
      #
      # apps/web/src/buildIdentity.test.ts checks the DEFAULT placeholder is honest. NO unit test
      # can check the stamp was APPLIED: nothing in a test can see whether the build step ran with
      # SUITE_COMMIT set. So the check happens here, against the emitted artifact —
      # scripts/build-release.sh runs the same `pnpm build` and then asserts
      # apps/web/dist/version.json names this commit and reports stamped:true.
      #
      # It is the SAME script the deploy runbook runs (deploy/README.md step 2). That matters: if
      # CI stamped via its own inline command and the runbook did not, this job would stay green
      # while every real deploy shipped an unidentifiable bundle.
      - run: scripts/build-release.sh web
      # THE DEPLOY DECISION EXPIRY REGISTER. Every runbook decision that rests on a premise,
      # with a command that says whether the premise still holds. Three decisions in one night
      # were right when made and wrong an hour later because someone removed the constraint they
      # were reasoned from; a prose "reopening condition" is a description nobody evaluates, so
      # these are executable and run here. Exits non-zero naming the document section that is
      # now void. Cross-repo premises are reported UNCHECKABLE, never as passes.
      - run: deploy/decision-expiry.sh
      # A `finally` DOES NOT RUN ON SIGTERM, and this repo has already paid for it.
      #
      # MEASURED (W1.7, 78c69c8): a 2-minute command timeout killed a control script mid-mutation;
      # the `finally` never ran and the tree was left with deploy/decision-expiry.sh reading
      # `if true; then` where a gate had been. NOTHING ABOUT THAT TREE LOOKED WRONG — the suite was
      # green and `git status` showed only files the session had edited on purpose. A kill landing
      # on a control whose mutation WEAKENS a guard leaves that weakening in the tree, green.
      #
      # ⚠ THE POPULATION GREW WHILE THE FIX SAT IN ONE FILE: 1 protected of 46 at 82cffd5, 2 of 58
      # at a083c67. Prose does not stop a population growing; this step does. The allowlist inside
      # the script may only SHRINK — R2 fails on an entry that has been fixed, R1 on a new
      # unprotected script.
      #
      # Detection is `ast`, never grep: the word "signal" appears in four English sentences in
      # scripts/w1121d-anchor-check-write-target-controls-j8w4.py, and `grep -l signal` calls that
      # file protected. A regex reads the documentation as the implementation.
      - run: python3 scripts/check-restore-signal-handlers.py --ci
      # B27.31 — /documentation lists every customer route Lens registers (lens-routes.json). Lens
      # lives in another repository, so no unit test here can see it: this reads Lens main's source
      # and fails when a documented route is no longer registered, instead of leaving the page
      # promising a 404. Last in the job so the extra checkout cannot touch the steps above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          repository: Talyvor/talyvor-lens
          path: .lens
          persist-credentials: false
      - run: node scripts/lens-routes.mjs .lens --check

  # The BFF gates. inc5 added the OIDC deps (go-oidc + x/oauth2), so there IS a
  # go.sum now — the module cache keys off it, and the Go version comes from
  # go.mod so the two can't drift.
  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      # FORMAT GATE. There was none — this job ran `go vet` and `go test` only, and TWO files
      # had already drifted on main with CI green (apps/bff/docs_ai.go,
      # apps/bff/docs_suggesttitle_test.go). talyvor-track shipped the identical defect and its
      # ci.yaml records the same cost there; a per-repo test cannot catch the next repo, so this
      # step is deliberately the SAME SHAPE as Track's: a plain `gofmt -l`, and NOT a golangci
      # formatter, so there is exactly one definition of "formatted" and no settings-shape trap.
      #
      # ⚠ THIS GATE'S FIRST RUN ON THIS BRANCH WAS RED, ON PURPOSE AND ON THE REAL DRIFT, so it
      # is a gate somebody has watched fail rather than one assumed to work. See the PR's check
      # history: the commit that added this step named both files before the commit that fixed
      # them landed.
      #
      # ⚠⚠ AND THE FIX WAS NOT `gofmt -w`. gofmt REFORMATS DOC COMMENTS, and on those two files it
      # rewrote CONTENT, not whitespace: `''` -> U+201D and ``…`` -> U+201C (the old godoc quote
      # convention). One of those sequences was MEASURED DATA — a comment enumerating the
      # completion shapes that yield {"title":""} listed `"''"`, and gofmt turned the two
      # apostrophes into a right double quotation mark. Running `gofmt -w` would have silently
      # falsified the measurement and this gate would then have enforced the falsification
      # forever. The literals now live in indented preformatted blocks, which gofmt leaves alone
      # (measured, not assumed), so they survive byte-identical.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "gofmt: clean"
      - run: go vet ./...
      - run: go test -race ./...
      # GUARD 2 FOR THE BFF HALF. version_test.go asserts bffVersion's default is an honest
      # placeholder AND that it is declared `var` (a const silently ignores -X — that was the real
      # bug in Lens #364). Neither can observe whether the link step actually ran, so this builds
      # the release binary with the stamp and asks it: `bff version` must print this commit, not
      # "dev". Drop the -X and this step fails.
      #
      # CI's runner IS linux/amd64, so this asserts the SHIPPED artifact directly rather than a
      # host-native stand-in — the script falls back to a plumbing probe only when cross-compiling
      # on a different host, and says so when it does.
      - run: scripts/build-release.sh bff
        working-directory: .

  # Supply-chain gate: govulncheck against the Go vulnerability DB.
  #
  # ⚠ THERE WAS NONE, AND THE ABSENCE IS THE FINDING (W6.36). Measured on clean main
  # `0ce0e603`: `govulncheck ./...` in apps/bff reported NINE CALLED vulnerabilities — CALLED,
  # not the separate "in modules you require but your code doesn't appear to call" bucket it
  # counts on its own line — and this file contained the word govulncheck zero times. Every one
  # of the nine is the STANDARD LIBRARY, not a dependency: net/http, crypto/tls, crypto/x509,
  # net/url, net/textproto, encoding/asn1. talyvor-lens has gated on this all along; track and
  # docs were fixed the same night (#202, #201); suite was one of the last two unwatched.
  #
  # ⚠⚠ IT USES `go-version-file`, DELIBERATELY, AND NOT A LITERAL PIN. govulncheck grades the
  # STDLIB against the toolchain it runs under, so the gate is only honest if it runs the Go this
  # repo actually SHIPS. A literal pin is a second number that can drift from go.mod — talyvor-lens
  # needs a whole package (internal/toolchainguard) to hold its literal pin in lockstep, and
  # talyvor-track needed one too. Reading the version from go.mod, exactly as the `bff` job above
  # already does, makes that drift impossible instead of merely detected.
  #
  # ⚠⚠⚠ AND THAT MAKES THIS GATE AN INSTRUMENT FOR THE TRAP W6.34 PAID FOR. actions/setup-go
  # exports GOTOOLCHAIN=local, so a `toolchain` directive is NOT auto-fetched in CI. W6.34 merged
  # a pin on talyvor-track whose commit message claimed an 11 → 2 improvement while CI still built
  # with go1.25.14 and golangci-lint refused to start — the pin was a comment. govulncheck names
  # the graded stdlib version in its own output ("Found in: net/http@goX.Y.Z"), so if the
  # directive ever stops reaching this job, THIS JOB SAYS SO IN WORDS rather than going quietly
  # green over a runtime nobody ships.
  #
  # Landed RED on purpose, before the toolchain floor that clears it; the PR's check history is
  # the evidence. A gate nobody has watched fail is the same thing as no gate.
  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
        with:
          go-version-file: apps/bff/go.mod
          cache-dependency-path: apps/bff/go.sum
      - name: report the Go this job actually runs
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # B28.263 — the frontend half of the supply-chain gate: `pnpm audit` over the whole workspace
  # lockfile (apps/web, packages/ui, e2e, dev dependencies included) fails on any known-vulnerable
  # package. It reads the lockfile only, so no install. Ignores live in pnpm-workspace.yaml's
  # auditConfig, each with the reason it has no fix to take.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (node24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
      - run: pnpm audit
      # B42.5 — and what the shipped app depends on, on its own line, so a prod finding is never read as a dev one.
      - run: pnpm audit --prod

  # B42.5 — Semgrep's managed default rules, pinned by version and digest as Docs and Track pin them. Fails on
  # ERROR severity; every WARNING it reports is fixed or carries a `nosemgrep: <rule> -- <reason>` in place.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.165.0@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - run: semgrep scan --config p/default --metrics=off --severity ERROR --error --quiet

  # B28.211 — the suite container image (Dockerfile): build it and prove it serves. It runs in the
  # posture a cluster runs it in — OIDC, bound beyond loopback — against a stub issuer that shares
  # its network namespace, because the BFF discovers the issuer at boot and refuses to start without.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - run: docker build --build-arg SUITE_COMMIT="$(git rev-parse --short HEAD)" -t talyvor-suite:ci .
      - name: the container answers /healthz and serves the app
        run: |
          commit="$(git rev-parse --short HEAD)"
          docker run -d --name idp -p 8787:8787 busybox:stable sh -c 'mkdir -p /w/.well-known &&
            echo "{\"issuer\":\"http://127.0.0.1:9999\",\"authorization_endpoint\":\"http://127.0.0.1:9999/a\",\"token_endpoint\":\"http://127.0.0.1:9999/t\",\"jwks_uri\":\"http://127.0.0.1:9999/k\"}" > /w/.well-known/openid-configuration &&
            exec httpd -f -p 127.0.0.1:9999 -h /w'
          sleep 1
          docker run -d --name bff --network container:idp -e BFF_AUTH_MODE=oidc \
            -e OIDC_ISSUER=http://127.0.0.1:9999 -e OIDC_CLIENT_ID=ci -e OIDC_CLIENT_SECRET=ci \
            -e OIDC_ALLOWED_EMAILS='*' -e BFF_PUBLIC_BASE_URL=https://app.example.test \
            -e LENS_PROVISION_SECRET=ci talyvor-suite:ci
          trap 'docker logs bff' EXIT
          get() { curl -fsS --retry 15 --retry-connrefused --retry-delay 1 "http://127.0.0.1:8787$1"; }
          get /healthz | grep '"status":"ok"'
          get / | grep -c '<div id="root">'
          v="$(get /api/version)"; echo "$v"
          grep -q '"agree":true' <<<"$v"
          grep -q "\"commit\":\"${commit}\"" <<<"$v"
